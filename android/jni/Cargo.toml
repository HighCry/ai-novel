[package]
name = "ai-novel-jni"
version = "0.1.0"
edition = "2021"
description = "Android JNI shim: runs the ai-novel axum server in-process for the APK"
license = "AGPL-3.0-or-later"

[lib]
name = "ainovel"
crate-type = ["cdylib"]

[dependencies]
ai-novel = { path = "../.." }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
jni = "0.21"
log = "0.4"
android_logger = "0.14"
